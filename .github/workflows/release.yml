name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            fichier: cc-agent-win-x64.exe
          - os: ubuntu-24.04
            rid: linux-x64
            fichier: cc-agent-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            fichier: cc-agent-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Outils de compilation native (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Compilation
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Agent/Agent.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o out
          if [ "${{ runner.os }}" = "Windows" ]; then cp out/cc-agent.exe "${{ matrix.fichier }}"; else cp out/cc-agent "${{ matrix.fichier }}"; fi
      # Signature Authenticode : a ajouter ici des que le certificat de signature de code est disponible.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.fichier }}

  installateur:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: dist
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Installateur Windows
        shell: pwsh
        env:
          AGENT_SITE_URL: ${{ vars.AGENT_SITE_URL }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSiteUrl=$env:AGENT_SITE_URL" "/DSourceExe=$PWD\dist\cc-agent-win-x64.exe" "/O$PWD\dist" install\windows\setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Signature Authenticode de l installateur : a ajouter ici avec le certificat de signature de code.
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-windows
          path: dist/agent-setup-windows-x64.exe

  publier:
    environment: release
    needs: [build, installateur]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Installateurs
        run: cp install/install.ps1 install/install.sh install/installer.bat install/installer.sh install/uninstall.sh install/uninstall.ps1 dist/
      - name: Empreintes et signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "Secret RELEASE_SIGNING_KEY absent"; exit 1; }
          cd dist
          sha256sum cc-agent-* agent-setup-windows-x64.exe install.ps1 install.sh installer.bat installer.sh uninstall.sh uninstall.ps1 > SHA256SUMS
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/cle.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/cle.pem" -out SHA256SUMS.sig SHA256SUMS
          rm -f "$RUNNER_TEMP/cle.pem"
          openssl dgst -sha256 -verify ../keys/release-public.pem -signature SHA256SUMS.sig SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/cc-agent-*
            dist/agent-setup-*
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
